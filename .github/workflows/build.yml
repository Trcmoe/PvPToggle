name: Build
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        with:
          name: PvPToggle
          path: target/PvPToggle-*.jar
